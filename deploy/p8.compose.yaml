name: ${V7_P8_PROJECT_NAME:-groundwater-v7-p8}

x-app: &app
  image: ${V7_P8_APP_IMAGE:?run scripts/build_p8_release.sh first}
  env_file: ["${V7_P8_ENV_FILE:?run scripts/configure_p8.py first}"]
  volumes:
    - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
  networks: [v7_private]
  restart: unless-stopped
  stop_grace_period: 35s

x-api-dependencies: &api_dependencies
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

x-worker-healthcheck: &worker_healthcheck
  test:
    - CMD
    - python
    - -c
    - >-
      import os, time;
      p = os.environ["V7_WORKER_HEARTBEAT_FILE"];
      s = os.stat(p);
      raise SystemExit(0 if time.time() - s.st_mtime <= 300 else 1)
  interval: 10s
  timeout: 3s
  retries: 3

services:
  postgres:
    image: postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: v7_p8_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${V7_P8_POSTGRES_PASSWORD:?required}
      V7_PLATFORM_DB_PASSWORD: ${V7_PLATFORM_DB_PASSWORD:?required}
      V7_DATA_DB_PASSWORD: ${V7_DATA_DB_PASSWORD:?required}
      V7_EXECUTION_DB_PASSWORD: ${V7_EXECUTION_DB_PASSWORD:?required}
      V7_KNOWLEDGE_DB_PASSWORD: ${V7_KNOWLEDGE_DB_PASSWORD:?required}
    ports: ["127.0.0.1:${V7_P8_POSTGRES_PORT:-55450}:5432"]
    volumes:
      - ${V7_P8_POSTGRES_DIR:?}:/var/lib/postgresql/data
      - ./p8/init-db.sh:/docker-entrypoint-initdb.d/10-v7-services.sh:ro
    networks: [v7_private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U v7_p8_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  volume-init:
    <<: *app
    user: "0:0"
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p "$V7_DATA_STORAGE" "$V7_KNOWLEDGE_STORAGE" "$V7_EXECUTION_WORKDIR" "$V7_EXECUTION_WORKDIR/platform-tmp" "$V7_DATA_SPATIAL_WORK_ROOT" "$(dirname "$V7_MAINTENANCE_FILE")"
        chown -R 65532:65532 "$V7_DATA_STORAGE" "$V7_KNOWLEDGE_STORAGE" "$V7_EXECUTION_WORKDIR" "$V7_DATA_SPATIAL_WORK_ROOT" "$(dirname "$V7_MAINTENANCE_FILE")"
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_DATA_DIR:?}:${V7_P8_DATA_DIR:?}
      - ${V7_P8_KNOWLEDGE_DIR:?}:${V7_P8_KNOWLEDGE_DIR:?}
      - ${V7_P8_EXECUTION_DIR:?}:${V7_P8_EXECUTION_DIR:?}
      - ${V7_P8_SPATIAL_DIR:?}:${V7_P8_SPATIAL_DIR:?}
      - ${V7_P8_CONTROL_DIR:?}:${V7_P8_CONTROL_DIR:?}

  migrate:
    <<: *app
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
      volume-init: {condition: service_completed_successfully}
    command:
      - /bin/sh
      - -ec
      - |
        platform-admin migrate
        agent-checkpoint-admin migrate
        data-admin migrate
        execution-admin migrate
        knowledge-admin migrate

  platform-api:
    <<: *app
    depends_on: *api_dependencies
    command: ["platform-api", "--host", "0.0.0.0", "--port", "8007"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/api/v1/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  data-api:
    <<: *app
    depends_on: *api_dependencies
    command: ["data-service"]
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_DATA_DIR:?}:${V7_P8_DATA_DIR:?}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/readyz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  execution-api:
    <<: *app
    depends_on: *api_dependencies
    command: ["execution-service"]
    ports: ["127.0.0.1:${V7_P8_EXECUTION_PORT:-18082}:8012"]
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_EXECUTION_DIR:?}:${V7_P8_EXECUTION_DIR:?}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/readyz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  knowledge-api:
    <<: *app
    depends_on: *api_dependencies
    command: ["knowledge-service"]
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_KNOWLEDGE_DIR:?}:${V7_P8_KNOWLEDGE_DIR:?}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/readyz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  gateway:
    <<: *app
    depends_on:
      platform-api: {condition: service_healthy}
    command: ["platform-gateway", "--host", "0.0.0.0", "--port", "8080"]
    ports: ["${V7_P8_GATEWAY_BIND:-127.0.0.1}:${V7_P8_GATEWAY_PORT:-18080}:8080"]
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_CONTROL_DIR:?}:${V7_P8_CONTROL_DIR:?}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/gateway/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  platform-worker:
    <<: *app
    group_add: ["${V7_DOCKER_GID:?required}"]
    environment:
      TMPDIR: ${V7_P8_EXECUTION_DIR:?}/platform-tmp
      V7_WORKER_HEARTBEAT_FILE: /tmp/v7-worker.heartbeat
    depends_on:
      platform-api: {condition: service_healthy}
      data-api: {condition: service_healthy}
      execution-api: {condition: service_healthy}
      knowledge-api: {condition: service_healthy}
    command: ["platform-worker"]
    healthcheck: *worker_healthcheck
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_EXECUTION_DIR:?}:${V7_P8_EXECUTION_DIR:?}
      - /var/run/docker.sock:/var/run/docker.sock

  authoring-worker:
    <<: *app
    group_add: ["${V7_DOCKER_GID:?required}"]
    environment:
      TMPDIR: ${V7_P8_EXECUTION_DIR:?}/platform-tmp
      V7_WORKER_HEARTBEAT_FILE: /tmp/v7-worker.heartbeat
    depends_on:
      platform-api: {condition: service_healthy}
      data-api: {condition: service_healthy}
      execution-api: {condition: service_healthy}
    command: ["platform-authoring-worker"]
    healthcheck: *worker_healthcheck
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_EXECUTION_DIR:?}:${V7_P8_EXECUTION_DIR:?}
      - /var/run/docker.sock:/var/run/docker.sock

  data-worker:
    <<: *app
    environment:
      V7_WORKER_HEARTBEAT_FILE: /tmp/v7-worker.heartbeat
    depends_on:
      data-api: {condition: service_healthy}
    command: ["data-worker"]
    healthcheck: *worker_healthcheck
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_DATA_DIR:?}:${V7_P8_DATA_DIR:?}

  data-document-worker:
    <<: *app
    environment:
      V7_WORKER_HEARTBEAT_FILE: /tmp/v7-worker.heartbeat
    depends_on:
      data-api: {condition: service_healthy}
    command: ["data-document-worker"]
    healthcheck: *worker_healthcheck
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_DATA_DIR:?}:${V7_P8_DATA_DIR:?}

  data-spatial-worker:
    <<: *app
    group_add: ["${V7_DOCKER_GID:?required}"]
    environment:
      V7_WORKER_HEARTBEAT_FILE: /tmp/v7-worker.heartbeat
    depends_on:
      data-api: {condition: service_healthy}
    command: ["data-spatial-worker"]
    healthcheck: *worker_healthcheck
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_DATA_DIR:?}:${V7_P8_DATA_DIR:?}
      - ${V7_P8_SPATIAL_DIR:?}:${V7_P8_SPATIAL_DIR:?}
      - /var/run/docker.sock:/var/run/docker.sock

  execution-supervisor:
    <<: *app
    group_add: ["${V7_DOCKER_GID:?required}"]
    environment:
      V7_WORKER_HEARTBEAT_FILE: /tmp/v7-worker.heartbeat
    depends_on:
      platform-api: {condition: service_healthy}
      data-api: {condition: service_healthy}
      execution-api: {condition: service_healthy}
    command: ["execution-worker", "--role", "supervisor"]
    healthcheck: *worker_healthcheck
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_EXECUTION_DIR:?}:${V7_P8_EXECUTION_DIR:?}
      - /var/run/docker.sock:/var/run/docker.sock

  execution-node-1:
    <<: *app
    group_add: ["${V7_DOCKER_GID:?required}"]
    environment:
      V7_WORKER_HEARTBEAT_FILE: /tmp/v7-worker.heartbeat
    depends_on:
      platform-api: {condition: service_healthy}
      data-api: {condition: service_healthy}
      execution-api: {condition: service_healthy}
    command: ["execution-worker", "--role", "node"]
    healthcheck: *worker_healthcheck
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_EXECUTION_DIR:?}:${V7_P8_EXECUTION_DIR:?}
      - /var/run/docker.sock:/var/run/docker.sock

  execution-node-2:
    extends:
      service: execution-node-1

  execution-publication:
    <<: *app
    group_add: ["${V7_DOCKER_GID:?required}"]
    environment:
      V7_WORKER_HEARTBEAT_FILE: /tmp/v7-worker.heartbeat
    depends_on:
      platform-api: {condition: service_healthy}
      data-api: {condition: service_healthy}
      execution-api: {condition: service_healthy}
    command: ["execution-worker", "--role", "publication"]
    healthcheck: *worker_healthcheck
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_EXECUTION_DIR:?}:${V7_P8_EXECUTION_DIR:?}
      - /var/run/docker.sock:/var/run/docker.sock

  knowledge-worker:
    <<: *app
    environment:
      V7_WORKER_HEARTBEAT_FILE: /tmp/v7-worker.heartbeat
    depends_on:
      data-api: {condition: service_healthy}
      knowledge-api: {condition: service_healthy}
    command: ["knowledge-worker"]
    healthcheck: *worker_healthcheck
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_KNOWLEDGE_DIR:?}:${V7_P8_KNOWLEDGE_DIR:?}

  agent-worker:
    <<: *app
    environment:
      V7_WORKER_HEARTBEAT_FILE: /tmp/v7-worker.heartbeat
    depends_on:
      platform-api: {condition: service_healthy}
      data-api: {condition: service_healthy}
      execution-api: {condition: service_healthy}
      knowledge-api: {condition: service_healthy}
    command: ["agent-worker"]
    healthcheck: *worker_healthcheck

  backup:
    <<: *app
    profiles: ["ops"]
    user: "0:0"
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    command: ["platform-cold-backup", "status"]
    volumes:
      - ${V7_P8_RELEASE_DIR:?}:${V7_P8_RELEASE_DIR:?}:ro
      - ${V7_P8_DATA_DIR:?}:${V7_P8_DATA_DIR:?}
      - ${V7_P8_KNOWLEDGE_DIR:?}:${V7_P8_KNOWLEDGE_DIR:?}
      - ${V7_P8_EXECUTION_DIR:?}:${V7_P8_EXECUTION_DIR:?}
      - ${V7_P8_SPATIAL_DIR:?}:${V7_P8_SPATIAL_DIR:?}
      - ${V7_P8_CONTROL_DIR:?}:${V7_P8_CONTROL_DIR:?}
      - ${V7_P8_BACKUP_DIR:?}:${V7_P8_BACKUP_DIR:?}
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  v7_private:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
