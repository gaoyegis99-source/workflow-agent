[project]
name = "groundwater-platform-contracts"
version = "0.15.5"
description = "Versioned wire contracts for Groundwater Platform V7"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_contracts"]
