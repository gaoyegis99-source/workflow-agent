[project]
name = "groundwater-temporal-workflow-runtime"
version = "0.15.5"
description = "Temporal orchestration boundary for governed V7 Agent workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "temporalio==1.34.0",
    "jsonschema>=4.23,<5",
    "opentelemetry-api>=1.42,<2",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1"]

[project.scripts]
v7-temporal-worker = "platform_temporal_workflows.worker:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_temporal_workflows"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
# Frozen-wire mappings are deliberately kept visually comparable with their
# documented JSON form; the workspace's other correctness rules still apply.
ignore = ["E501"]
