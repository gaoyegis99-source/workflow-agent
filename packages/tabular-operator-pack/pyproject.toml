[project]
name = "groundwater-tabular-operator-pack"
version = "0.15.5"
description = "Curated, standalone tabular operators for Groundwater Platform V7"
requires-python = ">=3.12,<3.13"
dependencies = ["pyarrow>=20,<26"]

[project.scripts]
platform-tabular-operator = "platform_tabular_operators.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_tabular_operators"]
