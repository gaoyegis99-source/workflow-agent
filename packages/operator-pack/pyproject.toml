[project]
name = "groundwater-operator-pack"
version = "0.15.5"
requires-python = ">=3.12,<3.13"
dependencies = ["pyarrow>=20,<26", "numpy>=2,<3"]

[project.scripts]
platform-operator = "platform_operators.cli:main"
platform-spatial = "platform_operators.spatial:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_operators"]
