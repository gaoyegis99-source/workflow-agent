[project]
name = "groundwater-checker-pack"
version = "0.15.5"
requires-python = ">=3.12,<3.13"
dependencies = ["pyarrow>=20,<26"]

[project.scripts]
platform-checker = "platform_checkers.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_checkers"]
