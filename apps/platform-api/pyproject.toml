[project]
name = "groundwater-platform-api"
version = "0.15.5"
description = "HTTP entrypoint for Groundwater Platform V7 unified enterprise workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "groundwater-platform-contracts==0.15.5",
    "groundwater-platform-core==0.15.5",
    "groundwater-platform-infrastructure==0.15.5",
    "fastapi>=0.115,<1",
    "starlette>=0.40,<2",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<0.29",
    "pyyaml>=6.0,<7",
]

[project.scripts]
platform-api = "platform_api.__main__:main"
platform-gateway = "platform_api.gateway:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_api"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
