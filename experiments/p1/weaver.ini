[app:main]
use = egg:crim-weaver
mongodb.host = mongodb
mongodb.port = 27017
mongodb.db_name = v7_p1
weaver.configuration = HYBRID
weaver.data_sources = __V7_P1_ROOT__/experiments/p1/weaver-sources.yaml
weaver.url = http://weaver.p1.test:4001
weaver.wps = true
weaver.wps_restapi = true
weaver.wps_output_dir = /v7-p1-outputs
weaver.wps_output_path = /wpsoutputs
weaver.wps_output_url = http://outputs.p1.test:8000/wpsoutputs
weaver.wps_processes_file =
weaver.cwl_processes_dir =
weaver.cwl_processes_register_error = true

[celery]
BROKER_URL = mongodb://mongodb:27017/celery
RESULT_BACKEND = mongodb://mongodb:27017/celery_results
CELERYD_CONCURRENCY = 1

[server:main]
use = egg:gunicorn#main
bind = 0.0.0.0:4001
workers = 2
threads = 4
timeout = 60

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = INFO
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = INFO
formatter = generic
[formatter_generic]
format = %(asctime)s %(levelname)s %(name)s %(message)s
